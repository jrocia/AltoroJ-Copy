name: "HCL AppScan SAST"

on:
  workflow_dispatch:
  pull_request:

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AppScan SAST Scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.7
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.APP_ID }}
          static_analysis_only: true
          wait_for_analysis: true

  report:
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Parse and publish security report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── Download scan job log ──────────────────────────────────────
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name == "scan") | .id')

          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > job.log

          # ── Extract data from log ──────────────────────────────────────
          TOTAL=$(grep  'Total issues:'  job.log | awk '{print $NF}' | tail -1)
          HIGH=$(grep   'High issues:'   job.log | awk '{print $NF}' | tail -1)
          MEDIUM=$(grep 'Medium issues:' job.log | awk '{print $NF}' | tail -1)
          LOW=$(grep    'Low issues:'    job.log | awk '{print $NF}' | tail -1)
          SCAN_ID=$(grep 'Scan ID:' job.log | awk '{print $NF}' | tail -1)
          SCAN_URL=$(grep 'https://cloud.appscan.com/main/myapps' job.log | awk '{print $NF}' | tail -1)

          TOTAL=${TOTAL:-0}; HIGH=${HIGH:-0}; MEDIUM=${MEDIUM:-0}; LOW=${LOW:-0}

          # ── Calculate percentages ──────────────────────────────────────
          PCT_HIGH=$(( TOTAL > 0 ? HIGH   * 100 / TOTAL : 0 ))
          PCT_MED=$((  TOTAL > 0 ? MEDIUM * 100 / TOTAL : 0 ))
          PCT_LOW=$((  TOTAL > 0 ? LOW    * 100 / TOTAL : 0 ))

          # ── Overall status ─────────────────────────────────────────────
          if   [ "$HIGH"   -gt 0 ]; then ICON="🔴"; STATUS="Critical issues found — immediate action required"
          elif [ "$MEDIUM" -gt 0 ]; then ICON="🟡"; STATUS="Review recommended"
          else                           ICON="🟢"; STATUS="No critical issues found"; fi

          # ── Build report ───────────────────────────────────────────────
          REPORT=$(cat <<HTML
          <h2>${ICON} AppScan SAST — Security Report</h2>
          <p><strong>${STATUS}</strong></p>

          <table>
          <tr>
            <th align="center">Total</th>
            <th align="center">🔴 High</th>
            <th align="center">🟡 Medium</th>
            <th align="center">🟢 Low</th>
          </tr>
          <tr>
            <td align="center"><strong>${TOTAL}</strong></td>
            <td align="center"><strong>${HIGH}</strong></td>
            <td align="center"><strong>${MEDIUM}</strong></td>
            <td align="center"><strong>${LOW}</strong></td>
          </tr>
          </table>

          <h3>Distribution</h3>

          <table width="100%">
          <tr>
            <td width="70"><strong>High</strong></td>
            <td><img src="https://progress-bar.xyz/${PCT_HIGH}/?width=400&color=D85A30&bg=f5f5f5" height="14"/></td>
            <td width="80" align="right">${PCT_HIGH}% (${HIGH})</td>
          </tr>
          <tr>
            <td><strong>Medium</strong></td>
            <td><img src="https://progress-bar.xyz/${PCT_MED}/?width=400&color=EF9F27&bg=f5f5f5" height="14"/></td>
            <td align="right">${PCT_MED}% (${MEDIUM})</td>
          </tr>
          <tr>
            <td><strong>Low</strong></td>
            <td><img src="https://progress-bar.xyz/${PCT_LOW}/?width=400&color=1D9E75&bg=f5f5f5" height="14"/></td>
            <td align="right">${PCT_LOW}% (${LOW})</td>
          </tr>
          </table>

          <h3>Scan Details</h3>
          <table>
          <tr><td><strong>Scan ID</strong></td><td><code>${SCAN_ID}</code></td></tr>
          <tr><td><strong>Commit</strong></td><td><code>${{ github.sha }}</code></td></tr>
          <tr><td><strong>Full report</strong></td><td><a href="${SCAN_URL}">${SCAN_URL}</a></td></tr>
          <tr><td><strong>Run</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Actions run #${{ github.run_id }}</a></td></tr>
          </table>
          HTML
          )

          # ── 1. Job Summary ─────────────────────────────────────────────
          echo "$REPORT" >> $GITHUB_STEP_SUMMARY

          # ── 2. PR comment (only on pull requests) ─────────────────────
          PR_NUMBER=$(gh pr view --json number -q .number 2>/dev/null || echo "")

          if [ -n "$PR_NUMBER" ]; then
            COMMENT_ID=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("AppScan SAST")) | .id' \
              | head -1)

            [ -n "$COMMENT_ID" ] && gh api --method DELETE \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}"

            gh pr comment "$PR_NUMBER" --body "$REPORT"
          fi
