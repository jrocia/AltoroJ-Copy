name: "HCL AppScan SAST"

on:
  workflow_dispatch:
  pull_request:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      total_issues:  ${{ steps.parse_results.outputs.total_issues }}
      high_issues:   ${{ steps.parse_results.outputs.high_issues }}
      medium_issues: ${{ steps.parse_results.outputs.medium_issues }}
      low_issues:    ${{ steps.parse_results.outputs.low_issues }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AppScan SAST Scan
        id: appscan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.7
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.APP_ID }}
          static_analysis_only: true
          wait_for_analysis: true

      - name: Parse results from this job's log
        id: parse_results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"

          # Pega o job_id deste job específico (não de outro run concorrente)
          JOB_ID=$(gh api \
            "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "scan") | .id')

          echo "Job ID: $JOB_ID"

          # Baixa o log deste job específico
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > job.log

          # Parseia as linhas do step do appscan
          TOTAL=$(grep  'Total issues:'  job.log | awk '{print $NF}' | tail -1)
          HIGH=$(grep   'High issues:'   job.log | awk '{print $NF}' | tail -1)
          MEDIUM=$(grep 'Medium issues:' job.log | awk '{print $NF}' | tail -1)
          LOW=$(grep    'Low issues:'    job.log | awk '{print $NF}' | tail -1)

          echo "total_issues=${TOTAL:-0}"   >> $GITHUB_OUTPUT
          echo "high_issues=${HIGH:-0}"     >> $GITHUB_OUTPUT
          echo "medium_issues=${MEDIUM:-0}" >> $GITHUB_OUTPUT
          echo "low_issues=${LOW:-0}"       >> $GITHUB_OUTPUT

          # Debug
          echo "Total=$TOTAL | High=$HIGH | Medium=$MEDIUM | Low=$LOW"
