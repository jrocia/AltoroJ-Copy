name: "HCL AppScan SAST"

on:
  workflow_dispatch:
  pull_request:

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Before scan
        run: |
          sudo apt update && sudo apt install gradle -y

      - name: Run AppScan SAST Scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.9
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.APP_ID }}
          static_analysis_only: true
          #open_source_only: true
          wait_for_analysis: true

  report:
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Parse and publish security report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── Download scan job log ──────────────────────────────────────
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name == "scan") | .id')

          gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" > job.log

          # ── Detect which scans ran ─────────────────────────────────────
          SAST_ID=$(grep -A1 'SAST scan ID:' job.log | tail -1 | tr -d '[:space:]')
          SCA_ID=$(grep  -A1 'SCA scan ID:'  job.log | tail -1 | tr -d '[:space:]')

          # Fallback: only one scan ran with generic "Scan ID:" label
          if [ -z "$SAST_ID" ] && [ -z "$SCA_ID" ]; then
            SAST_ID=$(grep 'Scan ID:' job.log | grep -v 'SAST\|SCA' | awk '{print $NF}' | tail -1)
          fi

          HAS_SAST=false; HAS_SCA=false
          [ -n "$SAST_ID" ] && HAS_SAST=true
          [ -n "$SCA_ID"  ] && HAS_SCA=true

          # ── Scan URLs ─────────────────────────────────────────────────
          # When both ran: first URL = SCA, last URL = SAST
          # When only one ran: single URL covers it
          ALL_URLS=$(grep 'https://cloud.appscan.com/main/myapps' job.log | awk '{print $NF}')
          URL_COUNT=$(echo "$ALL_URLS" | wc -l)

          if [ "$URL_COUNT" -ge 2 ]; then
            SCA_URL=$(echo  "$ALL_URLS" | head -1)
            SAST_URL=$(echo "$ALL_URLS" | tail -1)
          elif [ "$HAS_SAST" = true ]; then
            SAST_URL=$(echo "$ALL_URLS" | head -1)
            SCA_URL=""
          else
            SCA_URL=$(echo "$ALL_URLS" | head -1)
            SAST_URL=""
          fi

          # ── Detect if results are available (wait_for_analysis=true) ──
          HAS_RESULTS=false
          grep -q 'Analysis complete\.' job.log && HAS_RESULTS=true

          # ── Extract results ────────────────────────────────────────────
          # When both scans run together, only SAST results are printed in the log.
          # Both SAST-only and SCA-only follow the same severity format.
          if [ "$HAS_RESULTS" = true ]; then
            TOTAL=$(grep    'Total issues:'    job.log | awk '{print $NF}' | tail -1)
            CRITICAL=$(grep 'Critical issues:' job.log | awk '{print $NF}' | tail -1)
            HIGH=$(grep     'High issues:'     job.log | awk '{print $NF}' | tail -1)
            MEDIUM=$(grep   'Medium issues:'   job.log | awk '{print $NF}' | tail -1)
            LOW=$(grep      'Low issues:'      job.log | awk '{print $NF}' | tail -1)

            TOTAL=${TOTAL:-0}; CRITICAL=${CRITICAL:-0}
            HIGH=${HIGH:-0}; MEDIUM=${MEDIUM:-0}; LOW=${LOW:-0}

            PCT_CRIT=$(( TOTAL > 0 ? CRITICAL * 100 / TOTAL : 0 ))
            PCT_HIGH=$(( TOTAL > 0 ? HIGH     * 100 / TOTAL : 0 ))
            PCT_MED=$((  TOTAL > 0 ? MEDIUM   * 100 / TOTAL : 0 ))
            PCT_LOW=$((  TOTAL > 0 ? LOW      * 100 / TOTAL : 0 ))

            if   [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              ICON="🔴"; STATUS="Critical/High issues found — action required"
            elif [ "$MEDIUM" -gt 0 ]; then
              ICON="🟡"; STATUS="Review recommended"
            else
              ICON="🟢"; STATUS="No critical issues found"
            fi

            RESULTS_BLOCK=$(cat <<BLOCK
          <h3>Results</h3>
          <table>
          <tr>
            <th align="center">Total</th>
            <th align="center">🔴 Critical</th>
            <th align="center">🔶 High</th>
            <th align="center">🟡 Medium</th>
            <th align="center">🟢 Low</th>
          </tr>
          <tr>
            <td align="center"><strong>${TOTAL}</strong></td>
            <td align="center"><strong>${CRITICAL}</strong></td>
            <td align="center"><strong>${HIGH}</strong></td>
            <td align="center"><strong>${MEDIUM}</strong></td>
            <td align="center"><strong>${LOW}</strong></td>
          </tr>
          </table>

          <table width="100%">
          <tr><td width="70"><strong>Critical</strong></td><td><img src="https://progress-bar.xyz/${PCT_CRIT}/?width=400&color=7B1FA2&bg=f5f5f5" height="14"/></td><td width="80" align="right">${PCT_CRIT}% (${CRITICAL})</td></tr>
          <tr><td><strong>High</strong></td><td><img src="https://progress-bar.xyz/${PCT_HIGH}/?width=400&color=D85A30&bg=f5f5f5" height="14"/></td><td align="right">${PCT_HIGH}% (${HIGH})</td></tr>
          <tr><td><strong>Medium</strong></td><td><img src="https://progress-bar.xyz/${PCT_MED}/?width=400&color=EF9F27&bg=f5f5f5" height="14"/></td><td align="right">${PCT_MED}% (${MEDIUM})</td></tr>
          <tr><td><strong>Low</strong></td><td><img src="https://progress-bar.xyz/${PCT_LOW}/?width=400&color=1D9E75&bg=f5f5f5" height="14"/></td><td align="right">${PCT_LOW}% (${LOW})</td></tr>
          </table>
          BLOCK
            )

            # Note when both scans ran (SCA metrics not separately available in log)
            if [ "$HAS_SAST" = true ] && [ "$HAS_SCA" = true ]; then
              RESULTS_NOTE="<p><em>ℹ️ Results shown are from the SAST scan. SCA detailed metrics are not printed in the log when both scans run together — access the SCA report via the link below.</em></p>"
            else
              RESULTS_NOTE=""
            fi
          else
            ICON="🔵"
            STATUS="Scan submitted — results pending (wait_for_analysis not enabled)"
            RESULTS_BLOCK=""
            RESULTS_NOTE=""
          fi

          # ── Scan details table ─────────────────────────────────────────
          DETAILS_BLOCK="<h3>Scan Details</h3><table>"

          [ "$HAS_SAST" = true ] && DETAILS_BLOCK+="
          <tr><td><strong>SAST Scan ID</strong></td><td><code>${SAST_ID}</code></td></tr>
          <tr><td><strong>SAST Report</strong></td><td><a href=\"${SAST_URL}\">${SAST_URL}</a></td></tr>"

          [ "$HAS_SCA" = true ] && DETAILS_BLOCK+="
          <tr><td><strong>SCA Scan ID</strong></td><td><code>${SCA_ID}</code></td></tr>
          <tr><td><strong>SCA Report</strong></td><td><a href=\"${SCA_URL}\">${SCA_URL}</a></td></tr>"

          DETAILS_BLOCK+="
          <tr><td><strong>Commit</strong></td><td><code>${{ github.sha }}</code></td></tr>
          <tr><td><strong>Run</strong></td><td><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Actions run #${{ github.run_id }}</a></td></tr>
          </table>"

          # ── Assemble full report ───────────────────────────────────────
          REPORT=$(cat <<HTML
          <h2>${ICON} AppScan — Security Report</h2>
          <p><strong>${STATUS}</strong></p>
          ${RESULTS_BLOCK}
          ${RESULTS_NOTE}
          ${DETAILS_BLOCK}
          HTML
          )

          # ── 1. Job Summary ─────────────────────────────────────────────
          echo "$REPORT" >> $GITHUB_STEP_SUMMARY

          # ── 2. PR comment (only on pull requests) ─────────────────────
          PR_NUMBER=$(gh pr view --json number -q .number 2>/dev/null || echo "")

          if [ -n "$PR_NUMBER" ]; then
            COMMENT_ID=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("AppScan")) | .id' \
              | head -1)

            [ -n "$COMMENT_ID" ] && gh api --method DELETE \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}"

            gh pr comment "$PR_NUMBER" --body "$REPORT"
          fi
