name: "HCL AppScan SAST"

on:
  workflow_dispatch:
  pull_request:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      total_issues:  ${{ steps.parse_results.outputs.total_issues }}
      high_issues:   ${{ steps.parse_results.outputs.high_issues }}
      medium_issues: ${{ steps.parse_results.outputs.medium_issues }}
      low_issues:    ${{ steps.parse_results.outputs.low_issues }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Before scan
        run: |
          ls -la
          pwd

      - name: Run AppScan SAST Scan
        id: appscan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.7
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.APP_ID }}
          static_analysis_only: true
          wait_for_analysis: true

      - name: Parse results from runner log
        id: parse_results
        if: always()  # roda mesmo se o scan falhar
        run: |
          # O GitHub Actions salva o log de cada step neste path durante a execução
          LOG_FILE="${RUNNER_TEMP}/_github_workflow/$(echo '${{ github.run_id }}')/logs/$(echo '${{ github.job }}')/appscan.log"

          # Alternativa mais confiável: usar o log do workflow via arquivo de diagnóstico
          # O runner escreve os logs em $RUNNER_DIAGNOSTIC_LOGFILE quando ACTIONS_STEP_DEBUG=true
          # 
          # Solução mais simples: redirecionar o output para um arquivo compartilhado
          # usando uma variável de ambiente definida ANTES do step da action

          LOGFILE="${RUNNER_TEMP}/appscan_output.log"

          if [ -f "$LOGFILE" ]; then
            TOTAL=$(grep  'Total issues:'  "$LOGFILE" | awk '{print $NF}')
            HIGH=$(grep   'High issues:'   "$LOGFILE" | awk '{print $NF}')
            MEDIUM=$(grep 'Medium issues:' "$LOGFILE" | awk '{print $NF}')
            LOW=$(grep    'Low issues:'    "$LOGFILE" | awk '{print $NF}')

            echo "total_issues=${TOTAL:-0}"   >> $GITHUB_OUTPUT
            echo "high_issues=${HIGH:-0}"     >> $GITHUB_OUTPUT
            echo "medium_issues=${MEDIUM:-0}" >> $GITHUB_OUTPUT
            echo "low_issues=${LOW:-0}"       >> $GITHUB_OUTPUT
          else
            echo "❌ Log file não encontrado em $LOGFILE"
            exit 1
          fi
